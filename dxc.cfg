[filament_switch_sensor DXC]
pause_on_runout: true
switch_pin: !nozzle_mcu:PA10 # sensor port on the toolhead board
event_delay: 1.5
pause_delay: 0.25
insert_gcode: 
  M118 Filament inserted
  LOAD_MATERIAL # LOAD_FILAMENT IN SIMPLEAF
runout_gcode:
  M118 Out of filament
  {% if printer.extruder.can_extrude|lower == 'true' %}
    G91
    G1 E-30 F180 # retract 30mm slow
    G1 E-50 F2000 # retract  50mm fast
    G90
  {% endif %}

[respond]
default_type: echo
default_prefix: 